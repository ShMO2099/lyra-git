# OAuth applications Lyra signs in with, read by com.jfx.git.core.hosting.OAuthClients.
#
# Every value is blank until the maintainer registers the application and pastes its
# id here. A blank id means no "Sign in" button for that provider: the user can still
# paste a token. Nothing here is a secret in the strong sense - it ships inside the
# application - except that the Bitbucket secret should not be published anywhere else.
#
# <provider>.clientId          applies to the provider's public server only
# <provider>.<host>.clientId   applies to that host (e.g. gitea.codeberg.org.clientId)
# A self-hosted server needs its own registration; the user enters its client id in the
# integration's "Server..." dialog, stored as integration.<provider>.oauthClientId, which
# wins over this file.

# GitHub (github.com)
# Settings > Developer settings > OAuth Apps > New OAuth App. An OAuth App, not a GitHub
# App: a GitHub App only sees the repositories it is installed on.
#   Homepage URL:               the project page
#   Authorization callback URL: http://127.0.0.1/
#   Tick "Enable Device Flow".
# Copy the Client ID. Do NOT create or ship a client secret; the device flow needs none.
# Scopes requested at sign-in: repo read:org workflow
github.clientId=

# GitLab (gitlab.com)
# User Settings > Applications > Add new application.
#   Redirect URI: http://127.0.0.1:47823/callback
#   Untick "Confidential" (a desktop application cannot keep a secret).
#   Scopes:       api, read_user, write_repository
# Copy the Application ID. The device grant needs no redirect, but servers older than
# 17.2 fall back to the loopback flow, which uses the URI above.
gitlab.clientId=

# Bitbucket Cloud (bitbucket.org)
# Workspace settings > OAuth consumers > Add consumer.
#   Callback URL: http://127.0.0.1:47823/callback
#   Permissions:  Account: Read; Workspace membership: Read; Repositories: Write;
#                 Pull requests: Write
# Copy the Key (client id) here. The Secret is the one value in this file that must NOT be
# committed: Bitbucket's token endpoint requires it, so it ships inside the application,
# but it is supplied at build time instead -
#   release builds:  set LYRA_BITBUCKET_CLIENT_SECRET before running package-windows.sh /
#                    package-linux.sh (CI: the repository secret of the same name), which
#                    writes it into the packaged jar as oauth-secrets.properties;
#   trying it locally: put  bitbucket.clientSecret=...  in oauth-secrets.properties beside
#                    this file (git-ignored).
# Leave it blank here. Without a secret, Bitbucket's card offers tokens only.
bitbucket.clientId=
bitbucket.clientSecret=

# Codeberg (codeberg.org, Forgejo)
# Settings > Applications > Manage OAuth2 applications > Create application.
#   Redirect URI: http://127.0.0.1/callback  (Forgejo ignores the port of a loopback
#                 redirect but compares the path, and the sign-in listens on /callback)
#   Untick "Confidential client".
# Copy the Client ID. Forgejo has no scopes: the grant has full access to the account.
gitea.codeberg.org.clientId=
